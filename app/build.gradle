plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'io.github.takahirom.roborazzi'
}

android {
    namespace = 'com.caproverforge'
    compileSdk = 37 // Android 17

    defaultConfig {
        applicationId = "com.caproverforge"
        minSdk = 26
        targetSdk = 37 // Android 17
        // CI passes the run number so every published build is an upgrade of the previous one.
        versionCode = (System.getenv('VERSION_CODE') ?: '3').toInteger()
        versionName = System.getenv('VERSION_NAME') ?: '2.1-dev'
    }

    signingConfigs {
        // Committed on purpose: a fixed debug key lets each published debug APK install over the
        // previous one. It is a throwaway key (like Android's default debug.keystore), not a secret.
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        // Real release key, only when CI provides it (see README: "Signing release builds").
        if (System.getenv('RELEASE_KEYSTORE')) {
            release {
                storeFile = file(System.getenv('RELEASE_KEYSTORE'))
                storePassword = System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias = System.getenv('RELEASE_KEY_ALIAS')
                keyPassword = System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            if (System.getenv('RELEASE_KEYSTORE')) signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric downloads its Android runtime itself; use the same Central mirror.
                systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
                // Robolectric reaches into JDK internals (FileDescriptor access) on JDK 17+.
                jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED'
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        optIn.add('androidx.compose.material3.ExperimentalMaterial3Api')
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.3'
    implementation 'io.coil-kt.coil3:coil-svg:3.6.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.76.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.76.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.76.0'
}
