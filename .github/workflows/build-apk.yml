name: Build and Publish APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'  # Robolectric's Android 16 runtime needs JDK 21 (the app still targets Java 17)
        distribution: 'temurin'
        
    - name: Install Android 17 (API 37) SDK
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Lint and unit tests (records UI screenshots)
      run: ./gradlew lintDebug recordRoborazziDebug

    - name: Upload UI screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-screenshots
        path: app/screenshots/
        if-no-files-found: ignore

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      
    - name: Build Release APK
      run: ./gradlew assembleRelease
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-android17
        path: app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-android17
        path: app/build/outputs/apk/release/app-release-unsigned.apk
